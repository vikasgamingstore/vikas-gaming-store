<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Vikas Gaming Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080D; --surface:#121219; --surface-2:#191924; --line:#26263A;
    --violet:#7B5CFF; --violet-dim:#7B5CFF33; --cyan:#22D3F5; --cyan-dim:#22D3F533;
    --text:#F2F2F7; --text-dim:#9797AC; --text-faint:#5C5C74; --red:#F87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; }
  h1,h2{ font-family:'Poppins',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  input{ font-family:'Poppins',sans-serif; }
  .glow{ position:fixed; z-index:0; border-radius:50%; filter:blur(60px); pointer-events:none; }
  .glow.a{ top:-160px; right:-120px; width:520px; height:520px; background:radial-gradient(circle,var(--violet-dim),transparent 65%); }
  .glow.b{ bottom:-200px; left:-150px; width:480px; height:480px; background:radial-gradient(circle,var(--cyan-dim),transparent 65%); }
  .center{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:30px 20px; }
  .card{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:38px 32px; }
  .logo-mark{ width:74px; height:74px; border-radius:50%; object-fit:contain; background:#0D0D14; padding:3px; display:block; margin:0 auto 16px; }
  h1{ font-size:19px; text-align:center; margin-bottom:6px; }
  .sub{ font-size:13px; color:var(--text-dim); text-align:center; margin-bottom:26px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:11px; color:var(--text-faint); font-family:'Poppins'; letter-spacing:0.5px; }
  .field input{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:13.5px; }
  .field input:focus{ outline:none; border-color:var(--cyan); }
  .msg{ display:none; font-size:12.5px; padding:10px 14px; border-radius:9px; margin-bottom:16px; }
  .msg.show{ display:block; }
  .msg.err{ background:#F8717122; border:1px solid #F8717155; color:var(--red); }
  .msg.ok{ background:var(--cyan-dim); border:1px solid #22D3F555; color:var(--cyan); }
  .btn-main{ width:100%; padding:14px; border-radius:11px; font-weight:600; font-size:14px; background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#08080D; border:none; cursor:pointer; }
  .foot-note{ text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:22px; }
  @media(max-width:640px){
    .card{ padding:30px 20px; border-radius:16px; }
    .field input{ padding:13px 14px; font-size:14px; }
    .btn-main{ min-height:52px; }
  }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
</style>

<body>

<div class="glow a"></div>
<div class="glow b"></div>

<div class="center">
  <div class="card">
    <img class="logo-mark" alt="Vikas Gaming Store">
    <h1>Set a New Password</h1>
    <div class="sub" id="whoFor">Choose a new password for your account</div>

    <div class="msg err" id="errBox"></div>
    <div class="msg ok" id="okBox"></div>

    <div class="field">
      <label>NEW PASSWORD</label>
      <input type="password" id="pass1" placeholder="Minimum 6 characters">
    </div>
    <div class="field">
      <label>CONFIRM PASSWORD</label>
      <input type="password" id="pass2" placeholder="Re-enter password">
    </div>

    <button class="btn-main" id="submitBtn" onclick="doReset()">Update Password</button>

    <div class="foot-note"><a href="index.html" id="backLink">← Back to Store</a></div>
  </div>
</div>

<script>
if(new URLSearchParams(location.search).get('next') === 'admin'){
  document.getElementById('whoFor').textContent = 'Choose a new password for the admin panel';
}

function show(id, text){
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.add('show');
}

async function doReset(){
  document.getElementById('errBox').classList.remove('show');
  document.getElementById('okBox').classList.remove('show');

  const p1 = document.getElementById('pass1').value;
  const p2 = document.getElementById('pass2').value;

  if(!p1 || p1.length < 6){ show('errBox', 'Password must be at least 6 characters.'); return; }
  if(p1 !== p2){ show('errBox', 'Passwords do not match.'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating...';
  const { error } = await sb.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = 'Update Password';

  if(error){ show('errBox', error.message); return; }
  const isAdmin = new URLSearchParams(location.search).get('next') === 'admin';
  show('okBox', 'Password updated. Redirecting to login...');
  setTimeout(() => { window.location.href = isAdmin ? 'admin-login.html' : 'auth.html'; }, 1500);
}

/* The reset link puts a recovery session in the URL; warn if it's missing/expired */
(async () => {
  setTimeout(async () => {
    const user = await getSessionUser();
    if(!user){
      show('errBox', 'This reset link is invalid or has expired. Please request a new one from the login page.');
    }
  }, 800);
})();
</script>

</body>
</html>
