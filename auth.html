<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up — Vikas Gaming Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080D; --surface:#121219; --surface-2:#191924; --line:#26263A;
    --violet:#7B5CFF; --violet-dim:#7B5CFF33; --cyan:#22D3F5; --cyan-dim:#22D3F533;
    --gold:#F5B942; --text:#F2F2F7; --text-dim:#9797AC; --text-faint:#5C5C74;
    --green:#4ADE80; --red:#F87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; min-height:100vh; position:relative; overflow-x:hidden; }
  h1,h2,h3{ font-family:'Poppins',sans-serif; }
  .mono{ font-family:'Poppins',sans-serif; }
  a{ color:inherit; text-decoration:none; }
  input{ font-family:'Poppins',sans-serif; }

  body::before{
    content:""; position:fixed; inset:0;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:56px 56px; opacity:0.1; pointer-events:none;
  }
  .glow{ position:fixed; z-index:0; border-radius:50%; filter:blur(60px); pointer-events:none; }
  .glow.a{ top:-160px; right:-120px; width:520px; height:520px; background:radial-gradient(circle,var(--violet-dim),transparent 65%); }
  .glow.b{ bottom:-200px; left:-150px; width:480px; height:480px; background:radial-gradient(circle,var(--cyan-dim),transparent 65%); }

  header{ position:relative; z-index:2; padding:22px 32px; }
  .logo{ display:flex; align-items:center; gap:10px; width:fit-content; }
  .logo-mark{ width:40px; height:40px; border-radius:50%; object-fit:contain; background:#0D0D14; padding:2px; display:block; flex-shrink:0; }
  .logo-text{ font-family:'Poppins'; font-weight:700; font-size:17px; }

  .center{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; padding:30px 20px 80px; min-height:calc(100vh - 90px); }
  .auth-card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:36px 32px; }

  .switcher{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:4px; margin-bottom:28px; }
  .switcher button{ flex:1; padding:10px; border:none; background:none; color:var(--text-dim); font-size:13px; font-weight:600; border-radius:8px; cursor:pointer; }
  .switcher button.active{ background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#08080D; }

  .auth-view{ display:none; }
  .auth-view.active{ display:block; }

  .auth-view h2{ font-size:22px; margin-bottom:6px; }
  .auth-view .sub{ font-size:13px; color:var(--text-dim); margin-bottom:26px; }

  .mode-toggle{ display:flex; gap:8px; margin-bottom:20px; }
  .mode-toggle button{ flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; }
  .mode-toggle button.active{ border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:11px; color:var(--text-faint); font-family:'Poppins'; letter-spacing:0.5px; }
  .field .input-wrap{ position:relative; }
  .field input{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:13.5px; }
  .field input:focus{ outline:none; border-color:var(--cyan); }
  .field .prefix{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-faint); font-family:'Poppins'; }
  .field input.with-prefix{ padding-left:44px; }
  .field .toggle-eye{ position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text-faint); cursor:pointer; }

  .inline-link{ text-align:right; margin:-8px 0 18px; }
  .inline-link a{ font-size:12px; color:var(--cyan); font-weight:600; cursor:pointer; }


  .btn-main{ width:100%; padding:14px; border-radius:11px; font-weight:600; font-size:14px; background:linear-gradient(135deg,var(--violet),var(--cyan)); color:#08080D; border:none; cursor:pointer; box-shadow:0 0 26px var(--violet-dim); margin-top:4px; }
  .btn-ghost{ width:100%; padding:14px; border-radius:11px; font-weight:600; font-size:14px; background:var(--surface-2); color:var(--text); border:1px solid var(--line); cursor:pointer; margin-top:10px; }

  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0; }
  .divider .ln{ flex:1; height:1px; background:var(--line); }
  .divider span{ font-size:11px; color:var(--text-faint); font-family:'Poppins'; }

  .foot-note{ text-align:center; font-size:12.5px; color:var(--text-dim); margin-top:22px; }
  .foot-note a{ color:var(--cyan); font-weight:600; cursor:pointer; }

  .back-link{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); cursor:pointer; margin-bottom:18px; }
  .back-link:hover{ color:var(--text); }

  .success-box{ text-align:center; padding:20px 0; }
  .success-box .tick{ width:60px; height:60px; border-radius:50%; background:var(--cyan-dim); border:1px solid var(--cyan); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px; color:var(--cyan); }

  @media(max-width:480px){
    .auth-card{ padding:28px 22px; border-radius:16px; }
  }
  @media(max-width:640px){
    .field input{ padding:13px 14px; font-size:14px; }
    .btn-main, .btn-ghost{ min-height:52px; }
  }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<div class="glow a"></div>
<div class="glow b"></div>

<header>
  <a href="index.html" class="logo">
    <img class="logo-mark" alt="Vikas Gaming Store">
    <div class="logo-text">VIKAS GAMING STORE</div>
  </a>
</header>

<div class="center">
  <div class="auth-card">

    <div class="switcher" id="mainSwitcher">
      <button class="active" onclick="switchMain('login', this)">Login</button>
      <button onclick="switchMain('signup', this)">Create Account</button>
    </div>

    <!-- ================= LOGIN ================= -->
    <div class="auth-view active" id="view-login">
      <h2>Welcome Back</h2>
      <div class="sub">Login to track orders &amp; more</div>

      <div id="loginErrorBox" style="display:none; background:#F8717122; border:1px solid #F8717155; color:var(--red); font-size:12.5px; padding:10px 14px; border-radius:9px; margin-bottom:16px;"></div>

      <div class="field">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>

      <div class="field">
        <label>PASSWORD</label>
        <div class="input-wrap">
          <input type="password" id="loginPass" placeholder="Enter password">
          <span class="toggle-eye" onclick="togglePass('loginPass')">👁</span>
        </div>
      </div>

      <button class="btn-main" onclick="doLogin()" id="loginSubmitBtn">Login</button>

      <div class="foot-note">New to Vikas Gaming Store? <a onclick="switchMain('signup', document.querySelectorAll('#mainSwitcher button')[1])">Create an account</a></div>
    </div>

    <!-- ================= SIGNUP ================= -->
    <div class="auth-view" id="view-signup">
      <h2>Create Your Account</h2>
      <div class="sub">Join to shop consoles, controllers &amp; more</div>

      <div id="signupErrorBox" style="display:none; background:#F8717122; border:1px solid #F8717155; color:var(--red); font-size:12.5px; padding:10px 14px; border-radius:9px; margin-bottom:16px;"></div>

      <div class="field">
        <label>FULL NAME</label>
        <input type="text" id="signupName" placeholder="Enter your name">
      </div>

      <div class="field">
        <label>MOBILE NUMBER</label>
        <div class="input-wrap">
          <span class="prefix">+91</span>
          <input type="tel" class="with-prefix" id="signupPhone" placeholder="98765 43210" maxlength="10">
        </div>
      </div>

      <div class="field">
        <label>EMAIL ADDRESS</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>

      <div class="field">
        <label>CREATE PASSWORD</label>
        <div class="input-wrap">
          <input type="password" id="signupPass" placeholder="Minimum 6 characters">
          <span class="toggle-eye" onclick="togglePass('signupPass')">👁</span>
        </div>
      </div>

      <button class="btn-main" onclick="doSignup()" id="signupSubmitBtn">Create Account</button>

      <div class="foot-note">Already have an account? <a onclick="switchMain('login', document.querySelectorAll('#mainSwitcher button')[0])">Login</a></div>
    </div>

  </div>
</div>

<script>
function switchMain(view, btn){
  document.querySelectorAll('.auth-view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  if(view === 'login' || view === 'signup'){
    document.querySelectorAll('#mainSwitcher button').forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }
}
function togglePass(id){
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'index.html';

(async () => {
  const user = await getSessionUser();
  if(user) window.location.href = redirectTo;
})();

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErrorBox');
  errBox.style.display = 'none';
  if(!email || !password){ errBox.textContent = 'Please enter email and password.'; errBox.style.display = 'block'; return; }

  const btn = document.getElementById('loginSubmitBtn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Login';
  if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }
  window.location.href = redirectTo;
}

async function doSignup(){
  const full_name = document.getElementById('signupName').value.trim();
  const phone = document.getElementById('signupPhone').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPass').value;
  const errBox = document.getElementById('signupErrorBox');
  errBox.style.display = 'none';
  if(!full_name || !email || !password){ errBox.textContent = 'Please fill Name, Email and Password.'; errBox.style.display = 'block'; return; }
  if(password.length < 6){ errBox.textContent = 'Password must be at least 6 characters.'; errBox.style.display = 'block'; return; }

  const btn = document.getElementById('signupSubmitBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name, phone: phone ? '+91' + phone.replace(/[^0-9]/g,'') : null } }
  });
  btn.disabled = false; btn.textContent = 'Create Account';
  if(error){ errBox.textContent = error.message; errBox.style.display = 'block'; return; }

  fbq('track','CompleteRegistration',{ content_name:'Customer Signup', status:true });

  if(data.session){
    window.location.href = redirectTo;      /* logged in straight away */
  } else {
    errBox.style.color = 'var(--cyan)';
    errBox.textContent = 'Account created! Please check your email to confirm, then log in.';
    errBox.style.display = 'block';
  }
}

</script>

</body>
</html>
